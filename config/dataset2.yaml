# Dataset 2: BioID, DDA (EGFR, PDHA1, RAB11A)

dataset: Dataset 2 (BioID DDA)
level: protein

# Inputs
input_file: data/dataset2/intensity.tsv
baits: null    # null: every sample that is not a control
controls: [EGFP, HEK293]
control_match: substring    # substring or exact
labelling_enzyme: birA
bait_self_protein: {}
drop_unnamed: false

# Training
initial_positives: 15
initial_negatives: 200
n_decoy_replicates: 30

# Methods compared (scored outside this workflow; see README)
methods:
  saintq: data/dataset2/saintq.tsv
  saintexpress: data/dataset2/saintexpress.txt
  limma: data/dataset2/limma.tsv
  comppass: data/dataset2/comppass.csv
  sfinx: data/dataset2/sfinx.csv
  ppnsaf: data/dataset2/ppnsaf.csv
  mist: data/dataset2/mist.csv

# References (frozen; the copies used in the paper)
references:
  go_large: data/dataset2/gocc_reference.csv
  bg_large: data/dataset2/biogrid_reference.csv

# Identifier handling
map_identifiers: false    # UniProt -> gene symbol through src/goa_human.gaf
fdr_bins_map_ids: false
self_gene: {}
all_methods_in_main: false

# Only for regenerating the references (optional rules)
reference_generation:
  baits: [EGFR, RAB11A, PDHA1]
  term_size_threshold: 1000
  bait_self_prey: {}

# GO aspect references (Sup. Fig. 7; frozen)
go_aspects_dir: data/dataset2/go_aspects

# Outputs
table_number: 6    # Supplementary Table
results_dir: results/dataset2
steps: [benchmark, overlap, fdr_bins, label_quality, auc_range, per_bait, saint_intersection, go_aspects, gocc_sensitivity, fdr_bounds_methods, fdr_bounds_nulls, cross_validation, tuning_sweep, tuned_model, posneg_auc, label_diagnostics, supplementary_table]

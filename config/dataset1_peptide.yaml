# Dataset 1: BioID, DIA, peptide level; scores aggregated to proteins

dataset: 'Dataset 1 (BioID DIA, peptide level)'
level: peptide

# Inputs
input_file: data/dataset1/dia_peptide/intensity.tsv
baits: [ACTB, LMNA, MAPRE3, KRT8, CTNNA1]    # null: every sample that is not a control
controls: [EGFP, Empty, NminiTurbo]
control_match: substring    # substring or exact
labelling_enzyme: birA
bait_self_protein: {}
drop_unnamed: true

# Training
initial_positives: 15
initial_negatives: 200
n_decoy_replicates: 30

scores_file: FDR_BaitSpecific_Hierarchical_peptide_pr_matrix.csv
protein_scores_file: ProteinScores_fromPeptides_pr_matrix.csv

methods:
  saintq: data/dataset1/dia_peptide/saintq.tsv

references:
  go_large: data/dataset1/dia_peptide/gocc_reference.csv
  bg_large: data/dataset1/dia_peptide/biogrid_reference.csv

# Outputs
table_number: 4    # Supplementary Table
results_dir: results/dataset1/dia_peptide
steps: [level_benchmark, supplementary_table]
